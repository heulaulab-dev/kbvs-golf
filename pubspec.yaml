name: kbvs_golf
description: A Flutter golf companion app for KBVS — caddy tips, shot analysis, tournament tracking.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.44.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.0

  # State management
  provider: ^6.0.5

  # UI & widgets
  cupertino_icons: ^1.0.6

  # Network & API
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/data/