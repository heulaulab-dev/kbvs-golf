name: golfie
description: A Flutter golf companion app for Golfie — Jakarta golf tournament discovery, caddy tips, shot analysis, news.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.44.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core utilities
  intl: ^0.20.3
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.0
  flutter_secure_storage: ^10.0.0 # For auth token persistence
  connectivity_plus: ^7.0.0       # Network detection for auth
  fluttertoast: ^10.0.0            # Toast notifications for auth errors/successes

  # State management
  provider: ^6.0.5

  # UI & widgets
  cupertino_icons: ^1.0.6
  webview_flutter: ^4.5.0
  image_picker: ^1.0.0            # For avatar upload in onboarding (Phase 2)

  # Typography (Inter + Lora)
  google_fonts: ^8.2.1

  # Auth — Supabase
  supabase_flutter: ^2.0.0        # Supabase Flutter client for auth

  # Network & API
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/data/
